<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BroThatsJS.js (Pyodide Edition)</title>
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
    textarea { width: 100%; height: 150px; background: #000; color: #0f0; }
    pre { background: #000; padding: 10px; }
  </style>
</head>
<body>
  <h1>BroThatsJS.js (Pyodide)</h1>

  <textarea id="input" placeholder="Type JS code here..."></textarea>
  <button id="run">Run</button>
  <button id="reset">Reset Variables</button>

  <h2>Output</h2>
  <pre id="output"></pre>

  <script type="module">
    import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.26.0/full/pyodide.mjs";

    let pyodide;
    let run_bro;
    let reset_variables;

    async function main() {
      pyodide = await loadPyodide();

      const src = await (await fetch("brothatsjs.py")).text();
      await pyodide.runPythonAsync(src);

      run_bro = pyodide.globals.get("run_bro");
      reset_variables = pyodide.globals.get("reset_variables");
    }

    main();

    document.getElementById("run").onclick = async () => {
      const code = document.getElementById("input").value;
      const result = await run_bro(code);
      document.getElementById("output").textContent = result;
    };

    document.getElementById("reset").onclick = async () => {
      await reset_variables();
      document.getElementById("output").textContent = "Variables cleared.";
    };
  </script>
</body>
</html>
